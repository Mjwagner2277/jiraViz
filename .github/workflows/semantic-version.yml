name: Semantic Version Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply. Use auto to derive it from commit messages.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: semantic-version
  cancel-in-progress: false

jobs:
  tag:
    name: Create semantic version tag
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          REQUESTED_BUMP: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          if git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            echo "Current commit already has a semantic version tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0"
            range="HEAD"
          else
            range="${latest_tag}..HEAD"
          fi

          if [ -n "$latest_tag" ] && [ "$latest_tag" != "v0.0.0" ] && [ -z "$(git log --format=%H "$range")" ]; then
            echo "No commits found after $latest_tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commits="$(git log --format='%s%n%b' "$range")"
          bump="$REQUESTED_BUMP"

          if [ "$bump" = "auto" ]; then
            if printf '%s\n' "$commits" | grep -Eiq '(^BREAKING CHANGE:|^[a-z]+(\([^)]+\))?!:)'; then
              bump="major"
            elif printf '%s\n' "$commits" | grep -Eiq '^feat(\([^)]+\))?:'; then
              bump="minor"
            else
              bump="patch"
            fi
          fi

          version="${latest_tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: $bump" >&2
              exit 1
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          BUMP: ${{ steps.version.outputs.bump }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG" -m "Automated $BUMP version bump from $LATEST_TAG."
          git push origin "$NEXT_TAG"

      - name: Summary
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "Created semantic version tag: ${{ steps.version.outputs.next_tag }}"
            echo "Previous tag: ${{ steps.version.outputs.latest_tag }}"
            echo "Bump: ${{ steps.version.outputs.bump }}"
          } >> "$GITHUB_STEP_SUMMARY"
