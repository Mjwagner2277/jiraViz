<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">PINE Program Portfolio Report</title>
  <desc id="desc">Jira CSV visualization with release timeline and important epics over the next six months.</desc>
  <defs>
    <style>
      .page { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d8dde6; stroke-width: 1; }
      .ink { fill: #202124; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #667085; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 12px; }
      .label { font-size: 14px; font-weight: 700; }
      .epicTitle { font-size: 13px; font-weight: 700; }
      .epicMeta { font-size: 11px; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: 0; }
      .section { font-size: 19px; font-weight: 800; }
      .axis { stroke: #d7dde7; stroke-width: 1; }
      .grid { stroke: #e7ebf1; stroke-width: 1; }
      .releaseBar { stroke-width: 0; }
      .remainder { fill: #eef1f5; stroke: #cfd6e1; stroke-width: 1; }
      .completion { fill-opacity: 1; }
      .dot { fill: #ffffff; stroke-width: 3; }
      .notStarted { fill: #ffffff; stroke-width: 2; stroke-dasharray: 7 5; }
      .soft { fill: #f8fafc; stroke: #e1e6ee; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1200" height="820"/>

  <text class="ink title" x="56" y="58">PINE Program Portfolio Report</text>
  <text class="muted" x="56" y="86" font-size="14">Generated May 16, 2026 12:00 AM · Six-month window: May 16, 2026 to Nov 16, 2026</text>

  <rect class="panel" x="40" y="118" width="1120" height="390" rx="8"/>
  <text class="ink section" x="64" y="154">Release Timeline</text>
  <text class="muted small" x="64" y="176">Each release bar uses Fix Version dates from the CSV. The dot marks the release end date.</text>
  <line class="axis" x1="250" y1="194" x2="1120" y2="194"/>

    <line class="grid" x1="326" y1="194" x2="326" y2="482"/>
    <text class="muted small" x="326" y="184" text-anchor="middle">Jun</text>

    <line class="grid" x1="468" y1="194" x2="468" y2="482"/>
    <text class="muted small" x="468" y="184" text-anchor="middle">Jul</text>

    <line class="grid" x1="614" y1="194" x2="614" y2="482"/>
    <text class="muted small" x="614" y="184" text-anchor="middle">Aug</text>

    <line class="grid" x1="761" y1="194" x2="761" y2="482"/>
    <text class="muted small" x="761" y="184" text-anchor="middle">Sep</text>

    <line class="grid" x1="903" y1="194" x2="903" y2="482"/>
    <text class="muted small" x="903" y="184" text-anchor="middle">Oct</text>

    <line class="grid" x1="1049" y1="194" x2="1049" y2="482"/>
    <text class="muted small" x="1049" y="184" text-anchor="middle">Nov</text>

  <line x1="250" y1="194" x2="250" y2="482" stroke="#ba3a3a" stroke-width="2"/>
  <text class="muted small" x="250" y="498" text-anchor="middle">as of</text>


    <text class="ink label" x="64" y="218">PINE R1 Shell</text>
    <text class="muted small" x="64" y="218" dy="20">May 1 - Aug 15 · 1/4 done</text>
    <rect class="remainder" x="250" y="218" width="430" height="18" rx="9"/>
    <rect class="releaseBar" x="250" y="218" width="108" height="18" rx="9" fill="#2F6FED"/>
    <circle class="dot" cx="680" cy="218" r="7" dy="9" transform="translate(0 9)" stroke="#2F6FED"/>
    <text class="ink label" x="680" dx="16" y="218" dy="14">25%</text>

    <text class="ink label" x="64" y="280">PINE R2 MEP Buildout</text>
    <text class="muted small" x="64" y="280" dy="20">Aug 1 - Nov 10 · 0/4 done</text>
    <rect class="remainder" x="614" y="280" width="478" height="18" rx="9"/>
    <rect class="releaseBar" x="614" y="280" width="2" height="18" rx="9" fill="#188A7D"/>
    <circle class="dot" cx="1092" cy="280" r="7" dy="9" transform="translate(0 9)" stroke="#188A7D"/>
    <text class="ink label" x="1092" dx="16" y="280" dy="14">0%</text>


  <rect class="panel" x="40" y="532" width="1120" height="250" rx="8"/>
  <text class="ink section" x="64" y="568">Important Epics</text>
  <text class="muted small" x="64" y="590">Ranked by story points. Only epics that intersect the six-month window are eligible.</text>

    <rect class="soft" x="60" y="616" width="1080" height="54" rx="7"/>
    <text class="ink epicTitle" x="82" y="616" dy="22">#1 PINE-100 · Pine Ridge community center shell</text>
    <text class="muted epicMeta" x="82" y="616" dy="40">34 pts · 4 issues · May 1 - Aug 15</text>
    <rect class="remainder" x="650" y="616" width="183" height="16" rx="8"/>

      <rect class="completion" x="650" y="616" width="46" height="16" rx="8" fill="#2F6FED"/>

    <circle class="dot" cx="650" cy="616" r="5" transform="translate(0 8)" stroke="#2F6FED"/>
    <circle class="dot" cx="650" cy="616" r="5" transform="translate(183 8)" stroke="#2F6FED"/>
    <text class="ink label" x="855" y="616" dy="13">25%</text>

    <rect class="soft" x="60" y="668" width="1080" height="54" rx="7"/>
    <text class="ink epicTitle" x="82" y="668" dy="22">#2 PINE-200 · Pine Ridge MEP buildout</text>
    <text class="muted epicMeta" x="82" y="668" dy="40">34 pts · 4 issues · Aug 1 - Nov 10</text>
    <rect class="remainder" x="805" y="668" width="203" height="16" rx="8"/>

      <rect class="notStarted" x="805" y="668" width="203" height="16" rx="8" stroke="#188A7D"/>

    <circle class="dot" cx="805" cy="668" r="5" transform="translate(0 8)" stroke="#188A7D"/>
    <circle class="dot" cx="805" cy="668" r="5" transform="translate(203 8)" stroke="#188A7D"/>
    <text class="ink label" x="1030" y="668" dy="13">0%</text>

</svg>
