<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">All Epics Spanning Next 6 Months</title>
  <desc id="desc">Gantt style view of epics that start, end, overlap, or are contained in the six-month reporting window.</desc>
  <defs>
    <style>
      .page { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #cfd6e3; stroke-width: 1; }
      .soft { fill: #f8fafc; stroke: #d7dee9; stroke-width: 1; }
      .ink { fill: #202936; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5f6b7d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: 0; }
      .section { font-size: 28px; font-weight: 800; }
      .label { font-size: 21px; font-weight: 800; }
      .meta { font-size: 18px; font-weight: 600; }
      .small { font-size: 16px; font-weight: 600; }
      .axis { stroke: #cfd8e6; stroke-width: 1; }
      .grid { stroke: #d8e0ec; stroke-width: 1; stroke-dasharray: 6 10; }
      .today { stroke: #1f2937; stroke-width: 2; stroke-dasharray: 4 7; }
      .remainder { fill: #e9eef5; stroke: #c7d1df; stroke-width: 1; }
      .notStarted { fill: #ffffff; stroke-width: 2; stroke-dasharray: 8 7; }
      .continues { fill: #dfe6ef; stroke: #c7d1df; stroke-width: 1; }
      .legendText { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1400" height="1120"/>
  <rect class="panel" x="54" y="44" width="1292" height="1032" rx="8"/>

  <text class="ink section" x="94" y="104">All Epics Spanning Next 6 Months</text>
  <text class="muted label" x="94" y="144">Epics that start, end, overlap, or are contained in the reporting window.</text>
  <text class="ink title" x="94" y="230">REN Plan</text>
  <text class="muted meta" x="1306" y="214" text-anchor="end">Window: May 1 - Nov 1, 2026</text>
  <line class="axis" x1="94" y1="262" x2="1306" y2="262"/>

  <rect class="panel" x="94" y="328" width="1212" height="630" rx="7"/>
  <text class="ink section" x="130" y="383">Epic Schedule</text>
  <text class="muted meta" x="130" y="418">Filled portion indicates percent complete. Dashed bars indicate not started.</text>


    <line class="grid" x1="420" y1="466" x2="420" y2="1000"/>
    <text class="muted small" x="420" y="454" text-anchor="middle">May</text>

    <line class="grid" x1="538" y1="466" x2="538" y2="1000"/>
    <text class="muted small" x="538" y="454" text-anchor="middle">Jun</text>

    <line class="grid" x1="652" y1="466" x2="652" y2="1000"/>
    <text class="muted small" x="652" y="454" text-anchor="middle">Jul</text>

    <line class="grid" x1="770" y1="466" x2="770" y2="1000"/>
    <text class="muted small" x="770" y="454" text-anchor="middle">Aug</text>

    <line class="grid" x1="888" y1="466" x2="888" y2="1000"/>
    <text class="muted small" x="888" y="454" text-anchor="middle">Sep</text>

    <line class="grid" x1="1002" y1="466" x2="1002" y2="1000"/>
    <text class="muted small" x="1002" y="454" text-anchor="middle">Oct</text>

    <line class="grid" x1="1120" y1="466" x2="1120" y2="1000"/>
    <text class="muted small" x="1120" y="454" text-anchor="middle">Nov</text>

  <line class="today" x1="420" y1="466" x2="420" y2="1000"/>
  <text class="muted small" x="420" y="1034" text-anchor="middle">as of</text>


    <text class="ink label" x="130" y="520">Planning and permits</text>
    <text class="muted meta" x="130" y="520" dy="28">May 6 - Jul 15</text>

      <rect class="remainder" x="439" y="520" width="266" height="34" rx="7"/>


      <rect x="439" y="520" width="200" height="34" rx="7" fill="#2F6FED"/>
      <text class="ink label" x="727" y="520" dy="25">75%</text>


    <text class="ink label" x="130" y="592">Demo and rough-in</text>
    <text class="muted meta" x="130" y="592" dy="28">Jun 3 - Aug 16</text>

      <rect class="remainder" x="546" y="592" width="281" height="34" rx="7"/>


      <rect x="546" y="592" width="141" height="34" rx="7" fill="#188A7D"/>
      <text class="ink label" x="849" y="592" dy="25">50%</text>


    <text class="ink label" x="130" y="664">Finishes and fixtures</text>
    <text class="muted meta" x="130" y="664" dy="28">Jul 10 - Sep 28</text>

      <rect class="remainder" x="686" y="664" width="305" height="34" rx="7"/>


      <rect x="686" y="664" width="76" height="34" rx="7" fill="#B57600"/>
      <text class="ink label" x="1013" y="664" dy="25">25%</text>


    <text class="ink label" x="130" y="736">Inspection and move-in</text>
    <text class="muted meta" x="130" y="736" dy="28">Aug 12 - Oct 18</text>

      <rect class="remainder" x="812" y="736" width="255" height="34" rx="7"/>


      <rect x="812" y="736" width="64" height="34" rx="7" fill="#64748B"/>
      <text class="ink label" x="1089" y="736" dy="25">25%</text>



  <rect class="soft" x="94" y="1000" width="1212" height="76" rx="7"/>
  <rect class="remainder" x="122" y="1019" width="44" height="18" rx="3"/>
  <text class="muted legendText" x="182" y="1034">Epic date range in window</text>
  <rect x="424" y="1018" width="44" height="19" rx="4" fill="#2F6FED"/>
  <text class="muted legendText" x="482" y="1034">Completion fill</text>
  <rect class="notStarted" x="664" y="1017" width="70" height="20" rx="4" stroke="#8A98AB"/>
  <text class="muted legendText" x="750" y="1034">Not started</text>
  <rect class="continues" x="906" y="1018" width="44" height="19" rx="4"/>
  <text class="muted legendText" x="966" y="1034">Continues</text>
  <line class="today" x1="122" y1="1056" x2="166" y2="1056"/>
  <text class="muted legendText" x="182" y="1062">Today</text>
</svg>
